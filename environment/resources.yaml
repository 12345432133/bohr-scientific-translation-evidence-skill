schema_version: 1
python:
  required: ">=3.10"
  packages:
    - pdfplumber>=0.11,<1
    - pypdf>=5,<7
    - pypdfium2>=4,<6
    - jsonschema>=4.18,<5
runtime_commands:
  pdf_renderer:
    candidates:
      - pdftoppm
      - pypdfium2
  ocr:
    candidates:
      - tesseract
      - runtime ocr-tool
notes:
  - The evaluation image may provide its own pdf-text-tool, pdf-render-tool, or ocr-tool wrappers.
  - Inspect the supplied tool help before invoking a wrapper.
